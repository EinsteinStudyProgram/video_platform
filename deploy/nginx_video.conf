# ============================================================
# Nginx 配置 - 视频流媒体服务
# ============================================================
# 将此文件放置到 Nginx 的 sites-enabled 目录中，
# 或直接在 nginx.conf 中 include。
#
# 功能说明：
#   1. 反向代理 Django 应用
#   2. 直接处理视频/图片等静态媒体文件（高性能）
#   3. 支持 HTTP Range 请求（视频进度条拖拽的核心）
#   4. 上传目录禁止执行脚本（安全防护）
#   5. 大文件上传支持
# ============================================================

upstream django_backend {
    # Django 应用服务器（Gunicorn / uWSGI）
    server 127.0.0.1:8000;
    # 多实例时可添加更多后端
    # server 127.0.0.1:8001;
    # server 127.0.0.1:8002;
}

server {
    listen 80;
    server_name your-domain.com;

    # 客户端最大请求体大小（支持大文件上传）
    client_max_body_size 5G;
    proxy_request_buffering off;  # 关闭请求缓冲，支持大文件流式上传

    # ============================================================
    # 字符集与日志
    # ============================================================
    charset utf-8;
    access_log /var/log/nginx/video_access.log;
    error_log /var/log/nginx/video_error.log;

    # ============================================================
    # 静态资源（CSS, JS, 图片等）
    # ============================================================
    location /static/ {
        alias /path/to/video_platform/staticfiles/;
        expires 30d;                    # 静态资源缓存 30 天
        add_header Cache-Control "public, immutable";
    }

    # ============================================================
    # 媒体文件（视频、缩略图等）
    # -----------------------------------------------------------
    # 这是视频流媒体播放的关键配置。
    # Nginx 直接处理媒体文件，性能远高于 Django。
    #
    # 重点配置说明：
    #   - add_header Accept-Ranges bytes;  → 告知客户端支持范围请求
    #   - 不设置 X-Accel-Redirect，由 Nginx 直接返回文件
    # ============================================================
    location /media/ {
        alias /path/to/video_platform/media/;

        # 视频流媒体支持：允许客户端请求文件的部分内容
        add_header Accept-Ranges bytes;
        add_header 'Access-Control-Allow-Origin' '*';

        # 大文件优化：禁用零拷贝（对于跨文件系统场景）
        # sendfile on;  # 默认开启，如果容器部署遇到问题可关闭

        # 视频文件缓存策略
        location ~* \.(mp4|mov|avi|mkv|webm|flv)$ {
            expires 1h;                  # 视频文件缓存 1 小时
            add_header Cache-Control "public, no-transform";
        }

        # 图片缓存策略
        location ~* \.(jpg|jpeg|png|gif|webp)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ============================================================
    # 上传目录安全策略：禁止执行脚本
    # ============================================================
    location /media/uploads/ {
        alias /path/to/video_platform/media/;

        # 禁止 PHP/Python/Shell 等脚本执行
        location ~* \.(php|py|pl|sh|cgi|asp|aspx|jsp)$ {
            deny all;
            return 403;
        }
    }

    # ============================================================
    # Django 应用反向代理
    # ============================================================
    location / {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（如果后续实现实时评论等功能）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时配置
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ============================================================
    # Django Admin 路径（可限制 IP 访问）
    # ============================================================
    location /admin/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 建议限制管理后台的访问 IP
        # allow 你的IP地址;
        # deny all;
    }

    # ============================================================
    # 安全头配置
    # ============================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
