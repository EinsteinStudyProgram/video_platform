{% extends 'base.html' %}
{% load static %}

{% block title %}登录 - {{ site_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-12 col-sm-10 col-md-6 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-camera-reels-fill" style="font-size: 3rem; color: #0d6efd;"></i>
                    <h3 class="mt-2">{{ site_name }}</h3>
                    <p class="text-muted">登录您的账号</p>
                </div>

                <form method="POST" action="{% url 'users:login' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="username" class="form-label">用户名</label>
                        <input type="text" class="form-control" id="username"
                               name="username" placeholder="请输入用户名" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">密码</label>
                        <input type="password" class="form-control" id="password"
                               name="password" placeholder="请输入密码" required>
                    </div>
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-box-arrow-in-right me-1"></i>登录
                        </button>
                    </div>
                    <div class="d-flex justify-content-between small">
                        <a href="{% url 'users:register' %}" class="text-decoration-none">
                            还没有账号？立即注册
                        </a>
                        <a href="{% url 'users:password_reset' %}" class="text-decoration-none">
                            忘记密码？
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
