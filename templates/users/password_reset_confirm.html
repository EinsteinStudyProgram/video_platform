{% extends 'base.html' %}

{% block title %}设置新密码 - {{ site_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-12 col-sm-10 col-md-6 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-shield-lock" style="font-size: 3rem; color: #0d6efd;"></i>
                    <h3 class="mt-2">设置新密码</h3>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_new_password1" class="form-label">新密码</label>
                        <input type="password" class="form-control" id="id_new_password1"
                               name="new_password1" placeholder="请输入新密码" required>
                        <div class="form-text">
                            <small>密码至少 8 位，需包含大写字母和小写字母</small>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="id_new_password2" class="form-label">确认新密码</label>
                        <input type="password" class="form-control" id="id_new_password2"
                               name="new_password2" placeholder="请再次输入新密码" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-1"></i>重置密码
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
