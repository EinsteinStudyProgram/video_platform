{% extends 'base.html' %}
{% load static %}

{% block title %}重置密码 - {{ site_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-12 col-sm-10 col-md-6 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-key" style="font-size: 3rem; color: #0d6efd;"></i>
                    <h3 class="mt-2">重置密码</h3>
                    <p class="text-muted small">请输入注册时使用的邮箱，我们将向您发送重置链接</p>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="email" class="form-label">邮箱地址</label>
                        <input type="email" class="form-control" id="email"
                               name="email" placeholder="请输入邮箱" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-send me-1"></i>发送重置链接
                        </button>
                    </div>
                    <div class="text-center mt-3">
                        <a href="{% url 'users:login' %}" class="text-decoration-none small">
                            <i class="bi bi-arrow-left me-1"></i>返回登录
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
