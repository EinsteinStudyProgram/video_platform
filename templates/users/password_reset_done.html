{% extends 'base.html' %}

{% block title %}重置链接已发送 - {{ site_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-12 col-md-6 col-lg-4 text-center">
        <div class="card shadow-sm">
            <div class="card-body p-5">
                <i class="bi bi-envelope-check" style="font-size: 4rem; color: #198754;"></i>
                <h4 class="mt-3">邮件已发送</h4>
                <p class="text-muted">
                    如果该邮箱已注册，您将收到密码重置邮件。
                    请检查您的邮箱并点击邮件中的链接完成重置。
                </p>
                <p class="text-muted small">
                    如果没有收到邮件，请检查垃圾邮件文件夹，
                    或 <a href="{% url 'users:password_reset' %}">重新发送</a>。
                </p>
                <a href="{% url 'users:login' %}" class="btn btn-outline-primary">
                    <i class="bi bi-box-arrow-in-right me-1"></i>返回登录
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
