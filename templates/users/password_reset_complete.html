{% extends 'base.html' %}

{% block title %}密码重置成功 - {{ site_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-12 col-md-6 col-lg-4 text-center">
        <div class="card shadow-sm">
            <div class="card-body p-5">
                <i class="bi bi-check-circle" style="font-size: 4rem; color: #198754;"></i>
                <h4 class="mt-3">密码重置成功</h4>
                <p class="text-muted">您的密码已成功更新，现在可以使用新密码登录了。</p>
                <a href="{% url 'users:login' %}" class="btn btn-primary">
                    <i class="bi bi-box-arrow-in-right me-1"></i>去登录
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
